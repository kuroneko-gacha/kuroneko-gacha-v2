<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1a102b">
  <title>クロネコガチャ・一枚絵アニメ3種比較</title>
  <style>
    :root{--pink:#ff91c6;--mint:#89f1dc;--gold:#ffe27b;--purple:#c7a3ff}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;min-height:100%;margin:0;background:#170e26;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif}
    body{overflow-x:hidden}
    button{font:inherit}
    #launcher{min-height:100dvh;padding:max(22px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 5%,#71498a 0,#302047 40%,#160d24 100%)}
    .header{width:min(100%,430px);margin:0 auto 15px;text-align:center}
    .header .badge{display:inline-block;padding:6px 12px;border:1px solid #ffffff54;border-radius:99px;background:#ffffff12;color:#ffe9a7;font-size:11px;font-weight:900;letter-spacing:.08em}
    .header h1{margin:8px 0 5px;color:#fff8df;font-size:clamp(24px,7vw,32px);line-height:1.15;text-shadow:0 0 22px #ffaad088}
    .header p{margin:0;color:#dfd2eb;font-size:12px;line-height:1.55}
    .sceneList{display:grid;gap:11px;width:min(100%,430px);margin:0 auto}
    .choice{display:grid;grid-template-columns:106px 1fr;align-items:center;min-height:142px;padding:9px 11px 9px 6px;border:1px solid #ffffff2d;border-radius:24px;background:linear-gradient(145deg,#ffffff1a,#ffffff09);box-shadow:0 15px 32px #09041072;overflow:hidden}
    .choice img{display:block;width:106px;height:118px;object-fit:contain;filter:drop-shadow(0 9px 10px #09041099)}
    .choice h2{margin:0 0 3px;color:#fff8df;font-size:17px;line-height:1.25}
    .choice p{margin:0 0 9px;color:#d9cde5;font-size:11px;line-height:1.45}
    .play{border:0;border-radius:999px;padding:10px 16px;background:linear-gradient(135deg,var(--pink),#ffd477 58%,var(--mint));color:#29172e;font-weight:1000;font-size:13px;box-shadow:0 7px 18px #ff8fc653,0 0 0 2px #ffffff8f inset;touch-action:manipulation}
    .play:active{transform:scale(.97);filter:brightness(.94)}
    .note{display:block;width:min(100%,430px);margin:13px auto 0;text-align:center;color:#bdaeca;font-size:10px}

    #scene{position:fixed;z-index:100;inset:0;display:none;overflow:hidden;background:#100818;isolation:isolate}
    #scene.show{display:block}
    #sceneBg{position:absolute;z-index:0;inset:-5%;width:110%;height:110%;object-fit:cover;will-change:transform}
    #scene.show #sceneBg{animation:bgMove 6.9s ease-out both}
    @keyframes bgMove{0%{transform:scale(1.15) translateY(1.5%)}65%{transform:scale(1.055) translateY(-.5%)}100%{transform:scale(1.04) translateY(-1%)}}
    .shade{position:absolute;z-index:1;inset:0;background:linear-gradient(#16092769,#0000 40%,#10071d70);pointer-events:none}
    #sceneTitle{position:absolute;z-index:44;top:max(67px,calc(env(safe-area-inset-top) + 57px));left:3%;width:94%;margin:0;text-align:center;color:#fff9e5;font-size:clamp(21px,6vw,31px);font-weight:1000;white-space:nowrap;text-shadow:0 3px 5px #351544,0 0 20px var(--glow,#ffd27c);opacity:0}
    #scene.show #sceneTitle{animation:titleIn .72s .12s cubic-bezier(.18,1,.3,1) both}
    @keyframes titleIn{0%{opacity:0;transform:translateY(12px) scale(.82)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:none}}

    #catStage{position:absolute;z-index:12;left:50%;top:56%;width:min(96vw,455px);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 20px #0c0618ad) drop-shadow(0 0 13px var(--glow,#fff));will-change:transform,opacity}
    #sceneCat{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;backface-visibility:hidden}
    .scene-gacha.show #catStage{animation:gachaCat 4.8s cubic-bezier(.18,.8,.22,1) both}
    @keyframes gachaCat{
      0%{opacity:0;transform:translate(-112%,-41%) scale(.64) rotate(-8deg)}14%{opacity:1;transform:translate(-52%,-52%) scale(1.03) rotate(2deg)}22%{transform:translate(-50%,-50%) scale(.985) rotate(-1deg)}
      28%{transform:translate(-51.5%,-52%) scale(1.018,.99) rotate(1.4deg)}34%{transform:translate(-48.8%,-49%) scale(.985,1.012) rotate(-1.3deg)}40%{transform:translate(-51.2%,-52%) scale(1.02,.99) rotate(1.5deg)}
      46%{transform:translate(-49%,-49%) scale(.986,1.012) rotate(-1.2deg)}52%{transform:translate(-51%,-52%) scale(1.018,.992) rotate(1.2deg)}58%{transform:translate(-49%,-49%) scale(.99,1.01) rotate(-1deg)}
      68%{transform:translate(-50%,-50%) scale(1)}84%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:.48;transform:translate(-50%,-50%) scale(.92)}
    }
    .scene-rocket.show #catStage{animation:rocketCat 5.2s cubic-bezier(.19,.72,.2,1) both}
    @keyframes rocketCat{
      0%{opacity:0;transform:translate(calc(-50% - 78vw),calc(-50% + 34vh)) scale(.52) rotate(-17deg)}
      14%{opacity:1;transform:translate(calc(-50% - 18vw),calc(-50% + 8vh)) scale(.9) rotate(-7deg)}
      25%{transform:translate(calc(-50% + 16vw),calc(-50% - 18vh)) scale(.8) rotate(-21deg)}
      38%{transform:translate(calc(-50% - 21vw),calc(-50% - 12vh)) scale(.88) rotate(9deg)}
      52%{transform:translate(-50%,-50%) scale(1.03) rotate(-3deg)}
      62%{transform:translate(calc(-50% + 6vw),calc(-50% - 5vh)) scale(1.08) rotate(-8deg)}
      72%{transform:translate(calc(-50% - 3vw),calc(-50% + 2vh)) scale(.98) rotate(3deg)}
      82%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:.45;transform:translate(-50%,-50%) scale(.9)}
    }
    .scene-storybook.show #catStage{animation:bookCat 5.15s cubic-bezier(.14,.88,.2,1) both}
    @keyframes bookCat{
      0%{opacity:0;transform:translate(-50%,34%) scale(.58) rotate(-6deg)}
      18%{opacity:1;transform:translate(-50%,-54%) scale(1.03) rotate(2deg)}
      30%{transform:translate(-52%,-50%) scale(.98) rotate(-2deg)}
      42%{transform:translate(-48%,-56%) scale(1.025) rotate(2.2deg)}
      54%{transform:translate(-51%,-49%) scale(.99) rotate(-1.5deg)}
      66%{transform:translate(-49%,-55%) scale(1.02) rotate(1.5deg)}
      78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:.48;transform:translate(-50%,-50%) scale(.91)}
    }

    #groundShadow{position:absolute;z-index:9;left:50%;top:76%;width:min(67vw,310px);height:38px;border-radius:50%;background:#10091d82;filter:blur(9px);opacity:0;transform:translateX(-50%) scaleX(.3)}
    #scene.show #groundShadow{animation:shadow 4.7s .45s ease both}
    @keyframes shadow{0%{opacity:0;transform:translateX(-50%) scaleX(.3)}20%{opacity:.68}38%,60%{transform:translateX(-50%) scaleX(1.08)}48%,70%{transform:translateX(-50%) scaleX(.88)}100%{opacity:.5;transform:translateX(-50%) scaleX(1)}}
    .scene-rocket #groundShadow{display:none}

    #magicRing{position:absolute;z-index:7;left:50%;top:58%;width:min(74vw,335px);aspect-ratio:1;border:4px double #fff8b0;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.3);box-shadow:0 0 20px #fff,0 0 50px var(--glow),inset 0 0 28px var(--glow)}
    #magicRing:before,#magicRing:after{content:"✦  🐾  ✦  🐾  ✦  🐾";position:absolute;inset:8%;display:grid;place-items:center;border:2px dotted #cafff4;border-radius:50%;color:#fff6ac;font-size:13px;letter-spacing:7px;text-shadow:0 0 9px #fff}
    #magicRing:after{inset:22%;content:"✧　✦　✧";font-size:20px;letter-spacing:3px}
    .scene-storybook.show #magicRing{animation:magicRing 4.2s .75s linear both}
    @keyframes magicRing{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-70deg)}18%,78%{opacity:.9}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35) rotate(190deg)}}

    .trail{position:absolute;z-index:8;left:50%;top:55%;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 13px #fff,0 0 25px var(--glow);opacity:0}
    .t1{--x:-150px;--y:-160px;--d:.72s}.t2{--x:145px;--y:-120px;--d:.88s}.t3{--x:-135px;--y:95px;--d:1.04s}.t4{--x:142px;--y:112px;--d:1.2s}.t5{--x:12px;--y:-205px;--d:1.36s}.t6{--x:-45px;--y:170px;--d:1.52s}
    #scene.show .trail{animation:trailFly 1.4s var(--d) ease-out 2}
    @keyframes trailFly{0%{opacity:0;transform:translate(0,0) scale(.15)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.4)}}

    .capsule{position:absolute;z-index:17;left:50%;top:54%;width:25px;height:35px;border:3px solid #fff;border-radius:18px;background:linear-gradient(90deg,#fff7,#fff0 32%),linear-gradient(var(--c) 0 48%,#fff 49% 53%,var(--c2) 54%);box-shadow:0 0 13px #fff;opacity:0}
    .cp1{--c:#ff91c6;--c2:#ffd66f;--x:-125px;--y:-180px;--r:-38deg;--delay:2.45s}.cp2{--c:#8ef0db;--c2:#8ebfff;--x:115px;--y:-150px;--r:42deg;--delay:2.57s}.cp3{--c:#bda0ff;--c2:#ff9fc9;--x:152px;--y:-58px;--r:65deg;--delay:2.69s}.cp4{--c:#ffd66f;--c2:#8ef0db;--x:-155px;--y:-70px;--r:-60deg;--delay:2.81s}.cp5{--c:#8ebfff;--c2:#ff9fc9;--x:42px;--y:-210px;--r:19deg;--delay:2.93s}
    .scene-gacha.show .capsule{animation:capsulePop 1.55s var(--delay) cubic-bezier(.16,.82,.25,1) both}
    @keyframes capsulePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}20%{opacity:1}62%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) + 150px)) scale(.8) rotate(calc(var(--r) + 100deg))}}

    .page{position:absolute;z-index:17;left:50%;top:55%;width:47px;height:62px;border:2px solid #f1d698;border-radius:4px;background:linear-gradient(145deg,#fffef0,#edd9a5);box-shadow:0 0 16px #fff,0 0 25px var(--glow);opacity:0}
    .page:after{content:"🐾";display:grid;place-items:center;width:100%;height:100%;color:#c49254;font-size:16px}
    .pg1{--x:-145px;--y:-160px;--r:-120deg;--delay:1.65s}.pg2{--x:135px;--y:-135px;--r:96deg;--delay:1.85s}.pg3{--x:-165px;--y:55px;--r:-65deg;--delay:2.05s}.pg4{--x:155px;--y:70px;--r:135deg;--delay:2.25s}
    .scene-storybook.show .page{animation:pageFly 2.2s var(--delay) ease-in-out both}
    @keyframes pageFly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}25%{opacity:1}75%{opacity:1;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r))}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y) - 65px)) scale(.72) rotate(calc(var(--r) + 80deg))}}

    #fxLayer{position:absolute;z-index:21;inset:-5%;width:110%;height:110%;object-fit:cover;opacity:0;mix-blend-mode:screen;pointer-events:none;will-change:transform,opacity}
    .scene-gacha.show #fxLayer{animation:gachaFx 1.65s 3.1s ease-out both}
    @keyframes gachaFx{0%{opacity:0;transform:scale(.38) rotate(10deg)}28%{opacity:.9}100%{opacity:0;transform:scale(1.25) rotate(-8deg)}}
    .scene-rocket.show #fxLayer{animation:rocketFx 3.5s 1.25s ease-out both}
    @keyframes rocketFx{0%{opacity:0;transform:translateY(34%) scale(.72)}24%{opacity:.85}75%{opacity:.65;transform:translateY(-3%) scale(1.06)}100%{opacity:0;transform:translateY(-18%) scale(1.22)}}
    .scene-storybook.show #fxLayer{animation:bookFx 3.75s 1.05s linear both}
    @keyframes bookFx{0%{opacity:0;transform:scale(.55) rotate(-25deg)}22%,76%{opacity:.86}100%{opacity:0;transform:scale(1.18) rotate(28deg)}}
    #flash{position:absolute;z-index:24;inset:0;background:#fff;opacity:0;pointer-events:none}
    #scene.show #flash{animation:flash .72s 4.12s ease-out both}
    @keyframes flash{0%{opacity:0}18%{opacity:.9}100%{opacity:0}}

    #testSeal{position:absolute;z-index:32;left:50%;top:55%;width:min(52vw,235px);aspect-ratio:3/4;border:6px solid #fff;border-radius:24px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#fff,#fff3bd 42%,#ffb5d5 72%,#91f2dd);color:#382047;box-shadow:0 18px 50px #160a2c99,0 0 0 4px #ffe273,0 0 60px var(--glow);opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-10deg)}
    #testSeal .paw{font-size:clamp(65px,19vw,100px);line-height:1}.sealName{display:block;margin-top:-12px;font-size:clamp(18px,5vw,25px)}#testSeal small{font-size:11px}
    #scene.show #testSeal{animation:sealReveal 2.2s 4.2s cubic-bezier(.14,1.14,.22,1) both}
    @keyframes sealReveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-18deg)}42%{opacity:1;transform:translate(-50%,-55%) scale(1.16) rotate(4deg)}68%{transform:translate(-50%,-47%) scale(.94) rotate(-2deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    #closeButton{position:absolute;z-index:60;right:max(12px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));border:1px solid #ffffffa8;border-radius:999px;padding:10px 14px;background:#281a46e8;color:#fff;font-size:12px;font-weight:1000;box-shadow:0 6px 20px #29164770;touch-action:manipulation}
    #againButton{position:absolute;z-index:61;left:50%;bottom:max(25px,calc(env(safe-area-inset-bottom) + 17px));visibility:hidden;opacity:0;transform:translateX(-50%);border:0;border-radius:999px;padding:13px 22px;background:linear-gradient(135deg,var(--pink),#ffd477 58%,var(--mint));color:#28162d;font-weight:1000;font-size:14px;box-shadow:0 8px 22px #160a2c99,0 0 0 2px #fff9 inset}
    #scene.show #againButton{animation:againIn .45s 6.25s ease both}
    @keyframes againIn{from{visibility:visible;opacity:0;transform:translate(-50%,12px) scale(.85)}to{visibility:visible;opacity:1;transform:translateX(-50%)}}
    @media(max-height:700px){#sceneTitle{top:max(56px,calc(env(safe-area-inset-top) + 48px));font-size:clamp(19px,5.3vw,26px)}#catStage{top:53%;width:min(83vw,390px)}#testSeal{top:53%;width:min(43vw,205px)}}
    @media(max-width:350px){.choice{grid-template-columns:92px 1fr;min-height:130px}.choice img{width:92px;height:105px}.choice h2{font-size:15px}.choice p{font-size:10px}.header h1{font-size:23px}}
  </style>
</head>
<body>
  <main id="launcher">
    <header class="header">
      <span class="badge">通常演出・比較テスト</span>
      <h1>一枚絵アニメ 3種類</h1>
      <p>クロネコは分割せず、1枚のまま動かしています。</p>
    </header>
    <section class="sceneList">
      <article class="choice"><img id="thumb-gacha" alt="ガチャ機を回すクロネコ"><div><h2>ガチャ暴走</h2><p>踏ん張り・振動・カプセル噴出</p><button class="play" data-scene="gacha">演出を見る</button></div></article>
      <article class="choice"><img id="thumb-rocket" alt="ロケットに乗るクロネコ"><div><h2>おもちゃロケット</h2><p>上昇・旋回・急降下</p><button class="play" data-scene="rocket">演出を見る</button></div></article>
      <article class="choice"><img id="thumb-storybook" alt="魔法の絵本に乗るクロネコ"><div><h2>魔法の絵本</h2><p>浮遊・ページ・魔法光</p><button class="play" data-scene="storybook">演出を見る</button></div></article>
    </section>
    <small class="note">ガチャ券消費・GAS通信なし／テスト専用</small>
  </main>

  <section id="scene" aria-label="演出テスト">
    <img id="sceneBg" alt=""><div class="shade"></div>
    <h2 id="sceneTitle"></h2>
    <div id="groundShadow"></div><div id="magicRing"></div>
    <i class="trail t1"></i><i class="trail t2"></i><i class="trail t3"></i><i class="trail t4"></i><i class="trail t5"></i><i class="trail t6"></i>
    <div id="catStage"><img id="sceneCat" alt=""></div>
    <i class="capsule cp1"></i><i class="capsule cp2"></i><i class="capsule cp3"></i><i class="capsule cp4"></i><i class="capsule cp5"></i>
    <i class="page pg1"></i><i class="page pg2"></i><i class="page pg3"></i><i class="page pg4"></i>
    <img id="fxLayer" alt=""><div id="flash"></div>
    <div id="testSeal"><div><div class="paw">🐾</div><b class="sealName">テストシール</b><small>WHOLE IMAGE ANIMATION</small></div></div>
    <button id="closeButton">閉じる</button><button id="againButton">もう一度見る</button>
  </section>

    const scene=document.getElementById("scene"),bg=document.getElementById("sceneBg"),cat=document.getElementById("sceneCat"),fx=document.getElementById("fxLayer"),title=document.getElementById("sceneTitle");
    let current="gacha";
    for(const [id,item] of Object.entries(DATA)){document.getElementById("thumb-"+id).src=item.cat;for(const src of [item.bg,item.cat,item.fx]){const image=new Image();image.src=src}}
    function playScene(id){
      const item=DATA[id]||DATA.gacha;current=id in DATA?id:"gacha";
      scene.className="";void scene.offsetWidth;
      bg.src=item.bg;cat.src=item.cat;cat.alt=item.title+"のクロネコ";fx.src=item.fx;title.textContent=item.title;
      scene.style.setProperty("--glow",item.glow);scene.className="scene-"+current+" show";
      document.body.style.overflow="hidden";
    }
    function closeScene(){scene.className="";bg.removeAttribute("src");cat.removeAttribute("src");fx.removeAttribute("src");document.body.style.overflow=""}
    document.querySelectorAll(".play").forEach(button=>button.addEventListener("click",()=>playScene(button.dataset.scene)));
    document.getElementById("closeButton").addEventListener("click",closeScene);
    document.getElementById("againButton").addEventListener("click",()=>playScene(current));
  </script>
