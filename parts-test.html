<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1d1230">
  <title>クロネコガチャ・パーツアニメテスト</title>
  <style>
    :root{--pink:#ff9dc9;--mint:#8ff4dc;--gold:#ffe17b}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#180f29;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif}
    button{font:inherit}
    #launcher{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 18%,#694782 0,#2e1e46 42%,#160e25 100%)}
    .launchCard{width:min(92vw,410px);padding:16px 18px 22px;border:1px solid #ffffff38;border-radius:28px;background:linear-gradient(145deg,#ffffff1d,#ffffff0b);box-shadow:0 24px 70px #090511aa;text-align:center}
    .launchThumb{display:block;width:min(66vw,280px);height:220px;margin:0 auto 5px;object-fit:contain;border:0;border-radius:22px;filter:drop-shadow(0 15px 16px #09051199)}
    .launchCard h1{margin:0;color:#fff7dc;font-size:clamp(22px,6.2vw,30px);line-height:1.18;text-shadow:0 0 20px #ffbfdf88}
    .launchCard p{margin:10px 0 17px;color:#f5eefd;font-size:14px;line-height:1.7}
    #playButton,#replayButton{display:inline-block;border:0;border-radius:999px;padding:15px 28px;background:linear-gradient(135deg,#ff8bc2,#ffd479 55%,#8df2dc);color:#28162d;font-weight:1000;font-size:17px;text-decoration:none;box-shadow:0 9px 24px #ff91c866,0 0 0 2px #ffffff9c inset;touch-action:manipulation}
    #playButton:active,#replayButton:active{filter:brightness(.93)}
    .techNote{display:block;margin-top:12px;color:#d8cbe7;font-size:11px}

    #scene{position:fixed;inset:0;display:none;overflow:hidden;background:#160f25;isolation:isolate}
    #scene:target{display:block}
    #scene:target~#launcher{display:none}
    #sceneBg{position:absolute;inset:-4%;z-index:0;width:108%;height:108%;object-fit:cover;transform:scale(1.08);will-change:transform}
    #scene:target #sceneBg{animation:bgMove 7.4s ease-out both}
    @keyframes bgMove{0%{transform:scale(1.13) translateY(1.5%)}100%{transform:scale(1.035) translateY(-1%)}}
    .shade{position:absolute;z-index:1;inset:0;background:linear-gradient(#190f3140,#0000 52%,#130a2480);pointer-events:none}
    #fxLayer{position:absolute;z-index:12;inset:-5%;width:110%;height:110%;object-fit:cover;opacity:0;mix-blend-mode:screen;pointer-events:none;will-change:transform,opacity}
    #scene:target #fxLayer{animation:fxBurst 2.3s 3.25s ease-out both}
    @keyframes fxBurst{0%{opacity:0;transform:scale(.32) rotate(14deg)}28%{opacity:.9}100%{opacity:0;transform:scale(1.3) rotate(-9deg)}}
    .sceneTitle{position:absolute;z-index:30;top:max(66px,calc(env(safe-area-inset-top) + 58px));left:3%;width:94%;margin:0;text-align:center;color:#fff9e5;font-size:clamp(21px,6vw,31px);font-weight:1000;white-space:nowrap;text-shadow:0 3px 5px #3b1b52,0 0 20px #ffcf7d;opacity:0}
    #scene:target .sceneTitle{animation:titleIn .75s .2s cubic-bezier(.18,1,.3,1) both}
    @keyframes titleIn{0%{opacity:0;transform:translateY(12px) scale(.78)}70%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:none}}

    #puppetWrap{position:absolute;z-index:8;left:50%;top:54%;width:min(94vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 16px 18px #120922a8) drop-shadow(0 0 14px #9df4d6aa);will-change:transform}
    #scene:target #puppetWrap{animation:puppetEntrance 4.7s cubic-bezier(.16,.86,.22,1) both}
    @keyframes puppetEntrance{
      0%{opacity:0;transform:translate(-116%,-38%) scale(.62) rotate(-8deg)}
      17%{opacity:1;transform:translate(-51%,-52%) scale(1.02) rotate(2deg)}
      28%{transform:translate(-50%,-50%) scale(.98) rotate(-1deg)}
      44%{transform:translate(-51%,-52%) scale(1.015) rotate(1.3deg)}
      61%{transform:translate(-49%,-49%) scale(.99) rotate(-1.2deg)}
      76%{transform:translate(-50%,-52%) scale(1.02) rotate(.8deg)}
      100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    }
    .partGroup,.partImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;backface-visibility:hidden}
    .partGroup{will-change:transform}
    .partImg{display:block}
    .partBase{z-index:1}
    .tailGroup{z-index:2;transform-origin:24.35% 55.8%}
    .headGroup{z-index:3;transform-origin:30.65% 46.1%}
    .armsGroup{z-index:4;transform-origin:65.15% 49.7%}
    #scene:target .tailGroup{animation:tailWag .48s .58s ease-in-out 7 alternate}
    #scene:target .headGroup{animation:headEffort .31s .76s ease-in-out 10 alternate}
    #scene:target .armsGroup{animation:armsCrank .19s .82s ease-in-out 17 alternate}
    @keyframes tailWag{from{transform:rotate(-7deg) translateX(-1px)}to{transform:rotate(8deg) translateX(1px)}}
    @keyframes headEffort{from{transform:translateY(-2px) rotate(-1.6deg) scale(1.004,.996)}to{transform:translateY(5px) rotate(1.6deg) scale(.998,1.004)}}
    @keyframes armsCrank{from{transform:translate(-3px,-1px) rotate(-3.4deg)}to{transform:translate(4px,3px) rotate(3.4deg)}}
    .eyeLid{position:absolute;z-index:6;height:5.5%;border-radius:50%;background:#17131a;border-bottom:2px solid #d99a62;opacity:0;transform:scaleY(.12);pointer-events:none}
    .eyeLeft{left:29.5%;top:38.7%;width:8.2%;transform:rotate(-8deg) scaleY(.12)}
    .eyeRight{left:42.4%;top:33.7%;width:7.5%;transform:rotate(6deg) scaleY(.12)}
    #scene:target .eyeLid{animation:blink 1.15s 1s linear 3}
    @keyframes blink{0%,42%,58%,100%{opacity:0;transform:scaleY(.12)}48%,53%{opacity:1;transform:scaleY(1)}}

    .capsuleOrbit{position:absolute;z-index:5;left:69%;top:13%;width:22%;height:29%;border-radius:50%;overflow:hidden;pointer-events:none;opacity:0}
    #scene:target .capsuleOrbit{animation:orbitShow 2.4s 1.15s ease both}
    @keyframes orbitShow{0%{opacity:0}16%,82%{opacity:1}100%{opacity:0}}
    .miniCapsule{position:absolute;left:43%;top:42%;width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:var(--c);box-shadow:0 0 8px #fff;transform-origin:10px 10px;animation:orbit 1s linear infinite}
    .miniCapsule:nth-child(2){--c:#8df1e4;animation-delay:-.2s;transform-origin:28px 19px}
    .miniCapsule:nth-child(3){--c:#ffd56f;animation-delay:-.4s;transform-origin:-14px 24px}
    .miniCapsule:nth-child(4){--c:#bda2ff;animation-delay:-.6s;transform-origin:32px -8px}
    .miniCapsule:nth-child(5){--c:#8fcfff;animation-delay:-.8s;transform-origin:-12px -13px}
    @keyframes orbit{to{transform:rotate(360deg) translateX(22px) rotate(-360deg)}}

    .speedLine{position:absolute;z-index:6;left:-30%;top:var(--y);width:46%;height:4px;border-radius:99px;background:linear-gradient(90deg,transparent,#fff,#80ffe0,transparent);opacity:0;transform:rotate(var(--r));box-shadow:0 0 10px #83ffe4}
    #scene:target .speedLine{animation:speedLine 1.25s var(--delay) ease-out 2}
    @keyframes speedLine{0%{opacity:0;transform:translateX(0) rotate(var(--r)) scaleX(.4)}30%{opacity:.8}100%{opacity:0;transform:translateX(170vw) rotate(var(--r)) scaleX(1.4)}}
    #dropCapsule{position:absolute;z-index:18;left:56%;top:43%;width:66px;height:95px;border:4px solid #fff;border-radius:38px;background:linear-gradient(90deg,#fff8,#fff0 25%),linear-gradient(#8ff4dc 0 49%,#fff 50% 53%,#ff9dc9 54%);box-shadow:0 0 22px #fff,0 0 44px #88f5df;opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(-45deg);will-change:transform,opacity}
    #dropCapsule:after{content:"🐾";position:absolute;left:0;right:0;top:24px;text-align:center;font-size:24px;filter:drop-shadow(0 1px 0 #fff)}
    #scene:target #dropCapsule{animation:capsuleDrop 1.4s 3.15s cubic-bezier(.18,.9,.28,1.15) both}
    @keyframes capsuleDrop{0%{opacity:0;transform:translate(-50%,-175%) scale(.25) rotate(-50deg)}25%{opacity:1}70%{transform:translate(-50%,55%) scale(1.02) rotate(16deg)}84%{transform:translate(-50%,35%) scale(.9) rotate(-8deg)}100%{opacity:1;transform:translate(-50%,45%) scale(.96) rotate(0)}}
    #burst{position:absolute;z-index:19;left:50%;top:55%;width:80px;height:80px;border-radius:50%;opacity:0;background:radial-gradient(circle,#fff 0 8%,#fff48d 12%,#ff91c7aa 32%,transparent 68%);box-shadow:0 0 35px #fff,0 0 80px #ffcd7a;transform:translate(-50%,-50%) scale(.1)}
    #scene:target #burst{animation:burst 1.1s 4.36s ease-out both}
    @keyframes burst{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(10)}}
    #testSeal{position:absolute;z-index:22;left:50%;top:55%;width:min(52vw,235px);aspect-ratio:3/4;border:6px solid #fff;border-radius:24px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#fff,#fff3bd 42%,#ffb5d5 72%,#91f2dd);color:#382047;box-shadow:0 18px 50px #160a2c99,0 0 0 4px #ffe273,0 0 60px #9df4d6;opacity:0;transform:translate(-50%,-50%) scale(.1) rotateY(80deg)}
    #testSeal .paw{font-size:clamp(65px,19vw,100px);line-height:1;filter:drop-shadow(0 4px 0 #ffffffcc)}
    #testSeal b{display:block;margin-top:-12px;font-size:clamp(18px,5vw,25px)}
    #testSeal small{font-size:12px}
    #scene:target #testSeal{animation:sealReveal 2.5s 4.45s cubic-bezier(.14,1.14,.22,1) both}
    @keyframes sealReveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotateY(720deg)}45%{opacity:1;transform:translate(-50%,-55%) scale(1.16) rotateY(0)}70%{transform:translate(-50%,-47%) scale(.94)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    #skipButton{position:absolute;z-index:50;right:max(12px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));border:1px solid #ffffffa8;border-radius:999px;padding:10px 14px;background:#281a46e8;color:#fff;font-size:12px;font-weight:1000;text-decoration:none;box-shadow:0 6px 20px #29164770;touch-action:manipulation;user-select:none;-webkit-user-select:none}
    #replayButton{position:absolute;z-index:60;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);visibility:hidden;opacity:0;pointer-events:auto}
    #scene:target #replayButton{animation:replayIn .45s 7s ease both}
    @keyframes replayIn{from{visibility:visible;opacity:0;transform:translate(-50%,12px) scale(.85)}to{visibility:visible;opacity:1;transform:translateX(-50%)}}
    @media(max-height:700px){.sceneTitle{top:max(56px,calc(env(safe-area-inset-top) + 48px));font-size:clamp(19px,5.3vw,26px)}#puppetWrap{top:52%;width:min(82vw,380px)}#testSeal{top:53%;width:min(43vw,205px)}}
    @media(max-width:360px){#skipButton{padding:9px 11px;font-size:11px}.sceneTitle{font-size:19px}.launchThumb{height:195px}.launchCard{padding-top:12px}}
  </style>
</head>
