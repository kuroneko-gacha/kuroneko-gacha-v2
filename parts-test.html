<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#1c102c">
  <title>クロネコガチャ・一枚絵アニメテスト</title>
  <style>
    :root{--pink:#ff91c6;--mint:#86f2da;--gold:#ffe384;--ink:#25152f}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#180d27;color:#fff;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif}
    a{font:inherit}
    #launcher{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% 17%,#704984 0,#302047 42%,#150c22 100%)}
    .launchCard{width:min(92vw,410px);padding:15px 18px 22px;border:1px solid #ffffff38;border-radius:28px;background:linear-gradient(145deg,#ffffff1d,#ffffff0b);box-shadow:0 24px 70px #090511aa;text-align:center}
    .launchThumb{display:block;width:min(68vw,286px);height:224px;margin:0 auto 4px;object-fit:contain;border:0;filter:drop-shadow(0 15px 16px #09051199)}
    .launchCard h1{margin:0;color:#fff7dc;font-size:clamp(22px,6.2vw,30px);line-height:1.18;text-shadow:0 0 20px #ffbfdf88}
    .launchCard p{margin:10px 0 17px;color:#f5eefd;font-size:14px;line-height:1.65}
    #playButton,#backButton{display:inline-block;border:0;border-radius:999px;padding:15px 28px;background:linear-gradient(135deg,#ff8bc2,#ffd479 55%,#8df2dc);color:#28162d;font-weight:1000;font-size:17px;text-decoration:none;box-shadow:0 9px 24px #ff91c866,0 0 0 2px #ffffff9c inset;touch-action:manipulation}
    #playButton:active,#backButton:active{filter:brightness(.93)}
    .techNote{display:block;margin-top:12px;color:#d8cbe7;font-size:11px}

    #scene{position:fixed;inset:0;display:none;overflow:hidden;background:#160f25;isolation:isolate}
    #scene:target{display:block}
    #scene:target~#launcher{display:none}
    #sceneBg{position:absolute;z-index:0;inset:-5%;width:110%;height:110%;object-fit:cover;transform:scale(1.11) translateY(1%);will-change:transform}
    #scene:target #sceneBg{animation:bgDrift 6.8s cubic-bezier(.18,.75,.25,1) both}
    @keyframes bgDrift{0%{transform:scale(1.14) translateY(1.5%)}60%{transform:scale(1.055) translateY(-.5%)}100%{transform:scale(1.04) translateY(-1%)}}
    .shade{position:absolute;z-index:1;inset:0;background:linear-gradient(#170a2c5c,#0000 38%,#11081f75);pointer-events:none}
    .sceneTitle{position:absolute;z-index:40;top:max(67px,calc(env(safe-area-inset-top) + 58px));left:3%;width:94%;margin:0;text-align:center;color:#fff9e5;font-size:clamp(21px,6vw,31px);font-weight:1000;white-space:nowrap;text-shadow:0 3px 5px #3b1b52,0 0 20px #ffcf7d;opacity:0}
    #scene:target .sceneTitle{animation:titleIn .7s .15s cubic-bezier(.18,1,.3,1) both}
    @keyframes titleIn{0%{opacity:0;transform:translateY(12px) scale(.82)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:none}}

    #characterStage{position:absolute;z-index:10;left:50%;top:55%;width:min(96vw,455px);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 20px #10071fab) drop-shadow(0 0 14px #9df4d688);will-change:transform,opacity}
    #characterImage{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;backface-visibility:hidden}
    #scene:target #characterStage{animation:wholeCharacter 4.75s cubic-bezier(.18,.8,.22,1) both}
    @keyframes wholeCharacter{
      0%{opacity:0;transform:translate(-112%,-41%) scale(.64) rotate(-8deg)}
      14%{opacity:1;transform:translate(-52%,-52%) scale(1.03) rotate(2deg)}
      22%{transform:translate(-50%,-50%) scale(.985) rotate(-1deg)}
      28%{transform:translate(-51.5%,-52%) scale(1.018,.99) rotate(1.4deg)}
      34%{transform:translate(-48.8%,-49%) scale(.985,1.012) rotate(-1.3deg)}
      40%{transform:translate(-51.2%,-52%) scale(1.02,.99) rotate(1.5deg)}
      46%{transform:translate(-49%,-49%) scale(.986,1.012) rotate(-1.2deg)}
      52%{transform:translate(-51%,-52%) scale(1.018,.992) rotate(1.2deg)}
      58%{transform:translate(-49%,-49%) scale(.99,1.01) rotate(-1deg)}
      65%{transform:translate(-50.7%,-51.5%) scale(1.012,.995) rotate(.8deg)}
      73%{transform:translate(-50%,-50%) scale(1) rotate(0)}
      84%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:.52;transform:translate(-50%,-50%) scale(.92);filter:blur(1px)}
    }
    .groundShadow{position:absolute;z-index:8;left:50%;top:75%;width:min(67vw,310px);height:38px;border-radius:50%;background:#10091d85;filter:blur(9px);opacity:0;transform:translateX(-50%) scaleX(.3)}
    #scene:target .groundShadow{animation:shadowPulse 4s .55s ease both}
    @keyframes shadowPulse{0%{opacity:0;transform:translateX(-50%) scaleX(.3)}20%{opacity:.7}32%,46%,60%{transform:translateX(-50%) scaleX(1.08)}39%,53%,67%{transform:translateX(-50%) scaleX(.9)}100%{opacity:.6;transform:translateX(-50%) scaleX(1)}}

    .effortRing{position:absolute;z-index:7;left:50%;top:55%;width:min(38vw,170px);aspect-ratio:1;border:4px solid var(--mint);border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.25);box-shadow:0 0 14px #fff,0 0 24px var(--mint)}
    #scene:target .ring1{animation:ringPulse .9s 1.15s ease-out 3}
    #scene:target .ring2{animation:ringPulse .9s 1.45s ease-out 3}
    @keyframes ringPulse{0%{opacity:.8;transform:translate(-50%,-50%) scale(.22)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.65)}}
    .sweat{position:absolute;z-index:18;width:16px;height:25px;border-radius:60% 40% 65% 35%;background:linear-gradient(145deg,#fff,#82dfff);box-shadow:0 0 12px #fff;opacity:0;transform:rotate(35deg)}
    .s1{left:16%;top:44%}.s2{left:20%;top:39%;transform:rotate(48deg) scale(.72)}
    #scene:target .s1{animation:sweatFly .85s 1.15s ease-out 3}
    #scene:target .s2{animation:sweatFly .85s 1.48s ease-out 3}
    @keyframes sweatFly{0%{opacity:0;translate:20px 18px;scale:.45}25%{opacity:1}100%{opacity:0;translate:-30px -34px;scale:1.05}}

    .speedLine{position:absolute;z-index:6;left:-34%;top:var(--y);width:48%;height:4px;border-radius:99px;background:linear-gradient(90deg,transparent,#fff,#80ffe0,transparent);opacity:0;transform:rotate(var(--r));box-shadow:0 0 10px #83ffe4}
    #scene:target .speedLine{animation:speedLine 1.2s var(--delay) ease-out 2}
    @keyframes speedLine{0%{opacity:0;transform:translateX(0) rotate(var(--r)) scaleX(.4)}30%{opacity:.8}100%{opacity:0;transform:translateX(170vw) rotate(var(--r)) scaleX(1.4)}}
    .spark{position:absolute;z-index:16;left:50%;top:53%;width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 22px var(--gold);opacity:0}
    .spark:before,.spark:after{content:"";position:absolute;left:50%;top:50%;background:#fff;transform:translate(-50%,-50%);border-radius:99px}.spark:before{width:3px;height:30px}.spark:after{width:30px;height:3px}
    .sp1{--dx:-150px;--dy:-120px}.sp2{--dx:145px;--dy:-82px}.sp3{--dx:-128px;--dy:125px}.sp4{--dx:146px;--dy:116px}.sp5{--dx:12px;--dy:-176px}
    #scene:target .spark{animation:sparkFly 1.15s 3.18s ease-out both}
    @keyframes sparkFly{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.2)}18%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(160deg) scale(1.25)}}

    .capsuleSwarm{position:absolute;z-index:14;inset:0;pointer-events:none}
    .miniCapsule{position:absolute;left:50%;top:53%;width:28px;height:38px;border:3px solid #fff;border-radius:18px;background:linear-gradient(90deg,#fff7,#fff0 32%),linear-gradient(var(--c) 0 48%,#fff 49% 53%,var(--c2) 54%);box-shadow:0 0 14px #fff;opacity:0}
    .c1{--c:#ff91c6;--c2:#ffd66f;--tx:-125px;--ty:-180px;--rot:-38deg}.c2{--c:#8ef0db;--c2:#8ebfff;--tx:115px;--ty:-150px;--rot:42deg}.c3{--c:#bda0ff;--c2:#ff9fc9;--tx:152px;--ty:-58px;--rot:65deg}.c4{--c:#ffd66f;--c2:#8ef0db;--tx:-155px;--ty:-70px;--rot:-60deg}.c5{--c:#8ebfff;--c2:#ff9fc9;--tx:42px;--ty:-210px;--rot:19deg}
    #scene:target .miniCapsule{animation:capsulePop 1.55s 2.62s cubic-bezier(.16,.82,.25,1) both}
    #scene:target .c2{animation-delay:2.74s}#scene:target .c3{animation-delay:2.86s}#scene:target .c4{animation-delay:2.96s}#scene:target .c5{animation-delay:3.06s}
    @keyframes capsulePop{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0)}20%{opacity:1}62%{opacity:1;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1) rotate(var(--rot))}100%{opacity:0;transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty) + 160px)) scale(.82) rotate(calc(var(--rot) + 110deg))}}

    #fxLayer{position:absolute;z-index:20;inset:-5%;width:110%;height:110%;object-fit:cover;opacity:0;mix-blend-mode:screen;pointer-events:none;will-change:transform,opacity}
    #scene:target #fxLayer{animation:fxBurst 1.65s 3.18s ease-out both}
    @keyframes fxBurst{0%{opacity:0;transform:scale(.38) rotate(10deg)}28%{opacity:.95}100%{opacity:0;transform:scale(1.28) rotate(-8deg)}}
    #flash{position:absolute;z-index:22;inset:0;background:#fff;opacity:0;pointer-events:none}
    #scene:target #flash{animation:flash .7s 4.15s ease-out both}
    @keyframes flash{0%{opacity:0}18%{opacity:.92}100%{opacity:0}}

    #testSeal{position:absolute;z-index:30;left:50%;top:55%;width:min(52vw,235px);aspect-ratio:3/4;border:6px solid #fff;border-radius:24px;display:grid;place-items:center;text-align:center;background:linear-gradient(145deg,#fff,#fff3bd 42%,#ffb5d5 72%,#91f2dd);color:#382047;box-shadow:0 18px 50px #160a2c99,0 0 0 4px #ffe273,0 0 60px #9df4d6;opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-10deg)}
    #testSeal .paw{font-size:clamp(65px,19vw,100px);line-height:1;filter:drop-shadow(0 4px 0 #ffffffcc)}
    #testSeal b{display:block;margin-top:-12px;font-size:clamp(18px,5vw,25px)}
    #testSeal small{font-size:12px}
    #scene:target #testSeal{animation:sealReveal 2.25s 4.22s cubic-bezier(.14,1.14,.22,1) both}
    @keyframes sealReveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-18deg)}42%{opacity:1;transform:translate(-50%,-55%) scale(1.16) rotate(4deg)}68%{transform:translate(-50%,-47%) scale(.94) rotate(-2deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
    #closeButton{position:absolute;z-index:50;right:max(12px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));border:1px solid #ffffffa8;border-radius:999px;padding:10px 14px;background:#281a46e8;color:#fff;font-size:12px;font-weight:1000;text-decoration:none;box-shadow:0 6px 20px #29164770;touch-action:manipulation;user-select:none;-webkit-user-select:none}
    #backButton{position:absolute;z-index:60;left:50%;bottom:max(26px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);visibility:hidden;opacity:0}
    #scene:target #backButton{animation:backIn .45s 6.35s ease both}
    @keyframes backIn{from{visibility:visible;opacity:0;transform:translate(-50%,12px) scale(.85)}to{visibility:visible;opacity:1;transform:translateX(-50%)}}
    @media(max-height:700px){.sceneTitle{top:max(56px,calc(env(safe-area-inset-top) + 48px));font-size:clamp(19px,5.3vw,26px)}#characterStage{top:52%;width:min(84vw,390px)}#testSeal{top:53%;width:min(43vw,205px)}}
    @media(max-width:360px){#closeButton{padding:9px 11px;font-size:11px}.sceneTitle{font-size:19px}.launchThumb{height:195px}.launchCard{padding-top:12px}}
  </style>
</head>
